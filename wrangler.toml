name = "vintex-pms"
compatibility_date = "2024-09-01"

# Serves the Capacitor app's frontend (www/) as static assets. This is
# what capacitor.config.json's server.url loads at runtime in
# remote-first mode — NOT the same Worker as vintex-gateway, which
# only ever serves /api/* routes.
[assets]
directory = "./www"

# Gives this Worker a proper hostname under the same zone the gateway
# already uses (api.vintexguesthouse.com) — no new DNS record needed,
# since the zone is already on Cloudflare.
[[routes]]
pattern = "pms.vintexguesthouse.com/*"
zone_name = "vintexguesthouse.com"