apply plugin: 'com.android.application'

android {
    namespace = "com.vintexguesthouse.pms"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vintexguesthouse.pms"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridden per release build via -PAPP_VERSION_CODE / -PAPP_VERSION_NAME
        // (see .github/workflows/release-apk.yml). Falls back to these
        // defaults for local/dev builds where nothing is passed in —
        // versionCode 1 is fine there since a dev build is never what
        // gets installed over an existing app on a real device.
        versionCode project.hasProperty('APP_VERSION_CODE') ? (project.property('APP_VERSION_CODE') as Integer) : 1
        versionName project.hasProperty('APP_VERSION_NAME') ? project.property('APP_VERSION_NAME') : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // No custom "debug" config here on purpose — a hand-rolled
        // debug.keystore reference isn't guaranteed to exist in a fresh
        // CI checkout (keystores are typically .gitignore'd), which
        // made every CI-built debug APK sign with a different,
        // unpredictable key. Omitting this block lets the Android
        // Gradle Plugin fall back to its own built-in default debug
        // signing, which reliably self-manages its keystore. Debug
        // builds are smoke-test-only now (see build-apk.yml) — never
        // the thing distributed to the owner — so this is fine even
        // though it's still per-machine/per-runner.
        release {
            // Only populated when CI passes these properties (see
            // release-apk.yml). A local `./gradlew assembleRelease`
            // with no properties set produces an unsigned release
            // APK instead of erroring — signingConfig is only applied
            // in buildTypes.release below when the properties exist.
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // signingConfig intentionally omitted — see comment above.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
