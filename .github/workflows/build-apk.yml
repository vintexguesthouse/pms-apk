name: Smoke Build (every push)
#
# Sanity check only — proves the app still compiles on every push.
# This is NOT what the owner installs anymore; that's
# release-apk.yml, triggered by a version tag, which signs with the
# real persistent keystore and publishes a GitHub Release. Nothing
# from this workflow should ever be handed to a device.
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Install Dependencies
        run: npm ci
      - name: Build Tailwind CSS
        run: npm run build:css
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build Debug APK (unsigned/self-signed, smoke test only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK Artifact (CI verification only — not for install)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-smoke-build
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
